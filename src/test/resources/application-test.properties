# JWT
jwt.secret = thesecretisasecretethesecretisasecrete

# Datasource: allow override from CI via env or -D; fallback to H2 in-memory for local tests
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:master;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Force H2 driver for tests to avoid accidental use of MySQL driver during local runs
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
# Use a sensible default dialect (H2 for local), but allow override in CI when connecting to MySQL
spring.jpa.properties.hibernate.dialect=${SPRING_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
# Do not let Hibernate create/drop schema when using schema.sql (use SQL scripts to control schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=master
spring.main.allow-bean-definition-overriding=true

# Initialize schema/data from classpath (schema.sql + data.sql)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# H2 Console (only relevant for local runs)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console